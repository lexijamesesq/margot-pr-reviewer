# For a team that runs every job on GitHub-hosted runners. Store the deployment JSON
# and the configuration JSON (see config.sample.json) as GitHub variables; nothing
# trusted lives on a runner. The card bundle (publish-skills,
# https://github.com/lexijamesesq/publish-skills) is fetched at the commit the
# configuration pins. The cards and the voice run in the runtime image, which carries the
# ticketing server; the review job pulls it and checks out the pull request's base. The
# Claude CLI installed beside the release is for the decision fallback. Every secret and
# value below is a placeholder.
#
# Tokens: github.token reaches only the repository this workflow runs in, so every
# GitHub call uses a token minted from the review GitHub App, scoped to the target
# repository and to the permissions the step needs. YOUR_MARGOT_APP_CLIENT_ID is a
# variable and EXAMPLE_MARGOT_APP_KEY a secret. Minted tokens last an hour, so each job
# mints its own. GH_TOKEN is the read token, MARGOT_WRITE_TOKEN the publication token
# (it must come from the App, whose bot is publisher.actor), and the closer's GH_TOKEN
# is a checks-write token. The jobs' own permissions stay at contents: read; the review job adds packages:
# read, used with the workflow token to pull the runtime image. The read
# token also covers YOUR_REFERENCE_REPOSITORY, which must belong to the same owner as
# the target, since one installation token is scoped to one owner.
#
# Hosted CI classifies once, publishes the exact App-owned triage check, then
# dispatches this receiver with repo, pr, sha, base_sha and triage_check_id.
# CI reruns repeat that hosted work using ordinary Actions cancellation and rerun.
name: Margot review
on:
  workflow_dispatch:
    inputs:
      repo:
        description: repository of the pull request, as owner/name
        type: string
        required: true
      pr:
        description: pull request number
        type: string
        required: true
      sha:
        description: head commit of the pull request to review
        type: string
        required: true
      owned_tier:
        description: protected-path scrutiny tier
        type: string
        required: false
        default: unknown
      base_sha:
        description: base commit bound by hosted classification
        type: string
        required: true
      triage_check_id:
        description: exact App-owned successful classification check
        type: string
        required: true
permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.route.outputs.authority }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Bootstrap the exact release bytes
        env:
          MARGOT_ROOT: ${{ runner.temp }}/margot
          DEPLOYMENT_JSON: ${{ vars.YOUR_MARGOT_DEPLOYMENT_JSON }}
          CONFIG_JSON: ${{ vars.YOUR_MARGOT_CONFIG_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$MARGOT_ROOT" "$RUNNER_TEMP/trusted"
          printf '%s' "$DEPLOYMENT_JSON" > "$RUNNER_TEMP/trusted/deployment.json"
          printf '%s' "$CONFIG_JSON" > "$RUNNER_TEMP/trusted/config.json"
          package=$(jq -r .packageReference <<< "$DEPLOYMENT_JSON")
          sha256=$(jq -r .packageSha256 <<< "$DEPLOYMENT_JSON")
          archive="$MARGOT_ROOT/margot-pr-reviewer.tgz"
          curl --fail --location --silent --show-error "$package" --output "$archive"
          echo "$sha256  $archive" | sha256sum --check
          npm install --prefix "$MARGOT_ROOT" --ignore-scripts --save-exact "$archive"
          echo "MARGOT_ROOT=$MARGOT_ROOT" >> "$GITHUB_ENV"
      # Integrity is established before install by the SHA-256 check above.
      # This installed command is the post-install consistency check of the
      # pin's shape and target enrolment; it is not the byte-integrity control.
      - name: Validate the deployment and enrolled target
        id: route
        env:
          TARGET_REPO: ${{ inputs.repo }}
        run: |
          "$MARGOT_ROOT/node_modules/.bin/margot-instance" validate-deployment \
            --deployment "$RUNNER_TEMP/trusted/deployment.json" \
            --release-repository YOUR_ORG/margot-pr-reviewer \
            --repository "$TARGET_REPO" \
            --enrolled-repositories '["YOUR_ORG/YOUR_REPOSITORY"]' \
            --authority-repositories '["YOUR_ORG/YOUR_REPOSITORY"]'

  review:
    needs: route
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      published: ${{ steps.review.outputs.published }}
      stop_reason: ${{ steps.bind.outputs.stop_reason }}
      live_sha: ${{ steps.bind.outputs.live_sha }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Bootstrap the exact release bytes and the Claude CLI
        env:
          MARGOT_ROOT: ${{ runner.temp }}/margot
          DEPLOYMENT_JSON: ${{ vars.YOUR_MARGOT_DEPLOYMENT_JSON }}
          CONFIG_JSON: ${{ vars.YOUR_MARGOT_CONFIG_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$MARGOT_ROOT" "$RUNNER_TEMP/trusted"
          printf '%s' "$DEPLOYMENT_JSON" > "$RUNNER_TEMP/trusted/deployment.json"
          printf '%s' "$CONFIG_JSON" > "$RUNNER_TEMP/trusted/config.json"
          package=$(jq -r .packageReference <<< "$DEPLOYMENT_JSON")
          sha256=$(jq -r .packageSha256 <<< "$DEPLOYMENT_JSON")
          archive="$MARGOT_ROOT/margot-pr-reviewer.tgz"
          curl --fail --location --silent --show-error "$package" --output "$archive"
          echo "$sha256  $archive" | sha256sum --check
          cli=$(jq -r .claude.version <<< "$CONFIG_JSON")
          # The Claude CLI is the exact version the configuration pins, installed beside
          # the release; its own install step links the native binary, so only that
          # package's step is run.
          npm install --prefix "$MARGOT_ROOT" --ignore-scripts --save-exact \
            "$archive" "@anthropic-ai/claude-code@$cli"
          npm rebuild --prefix "$MARGOT_ROOT" @anthropic-ai/claude-code
          echo "MARGOT_ROOT=$MARGOT_ROOT" >> "$GITHUB_ENV"
          echo "CLAUDE_CONFIG_DIR=$MARGOT_ROOT/claude-state" >> "$GITHUB_ENV"
      - name: Check out the card bundle at its pinned commit
        run: |
          set -euo pipefail
          commit=$(jq -r .review.cardBundle.commit "$RUNNER_TEMP/trusted/config.json")
          bundle="$MARGOT_ROOT/publish-skills"
          git init --quiet "$bundle"
          git -C "$bundle" fetch --quiet --depth 1 \
            https://github.com/lexijamesesq/publish-skills "$commit"
          git -C "$bundle" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$bundle" rev-parse HEAD)" = "$commit"
      - name: Name the target repository
        id: target
        env:
          TARGET_REPO: ${{ inputs.repo }}
        run: |
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET_REPO#*/}" >> "$GITHUB_OUTPUT"
      - name: Mint the read token (target repository)
        id: read
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YOUR_MARGOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.EXAMPLE_MARGOT_APP_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: |
            ${{ steps.target.outputs.name }}
            YOUR_REFERENCE_REPOSITORY
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
          permission-actions: read
      - name: Bind trusted configuration to the requested PR
        id: bind
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          TARGET_REPO: ${{ inputs.repo }}
          PR_NUMBER: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          TRIAGE_CHECK_ID: ${{ inputs.triage_check_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          "$MARGOT_ROOT/node_modules/.bin/margot-instance" bind-request \
            --repository "$TARGET_REPO" --pr "$PR_NUMBER" --head "$HEAD_SHA" \
            --base "$BASE_SHA" --triage-check-id "$TRIAGE_CHECK_ID" \
            --phase review --authority "${{ needs.route.outputs.authority }}" \
            --margot-root "$MARGOT_ROOT" --config "$RUNNER_TEMP/trusted/config.json" \
            --required-checks '["YOUR_REQUIRED_CHECK"]' \
            --protected-paths '["YOUR_AUTHORITY_PATH/**"]' \
            --allowed-skipped-checks '[]' --run-url "$RUN_URL"
      - name: Check out the pull request's base read-only for the reviewers
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          TARGET_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          # The base the bound request records, which the review verifies the checkout against.
          base=$(jq -er .base "$MARGOT_ROOT/request.json")
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          work="$MARGOT_ROOT/work"
          git init --quiet "$work"
          git -C "$work" remote add origin "https://github.com/$TARGET_REPO"
          # The token reaches git through a credential helper reading the environment,
          # never on the command line.
          git -C "$work" -c credential.helper= \
            -c "credential.helper=!f() { echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f" \
            fetch --quiet --depth 1 origin "$base"
          git -C "$work" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$work" rev-parse HEAD)" = "$base"
      # This sample's image is on GHCR, read with the workflow's own token (packages: read);
      # log in to your own registry otherwise.
      - name: Pull the reviewers' runtime image
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          image=$(jq -r .claude.container.image "$RUNNER_TEMP/trusted/config.json")
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            export DOCKER_CONFIG="$MARGOT_ROOT/docker-config"
            mkdir -p "$DOCKER_CONFIG"
            printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
            docker pull --quiet "$image"
            rm -rf "$DOCKER_CONFIG"
          fi
      - name: Mint the publication token (target repository)
        id: write
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YOUR_MARGOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.EXAMPLE_MARGOT_APP_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: |
            ${{ steps.target.outputs.name }}
          # contents: write is for disablePullRequestAutoMerge, which a held verdict calls.
          permission-contents: write
          permission-pull-requests: write
          permission-checks: write
      - name: Review the bound request
        id: review
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          MARGOT_WRITE_TOKEN: ${{ steps.write.outputs.token }}
          MARGOT_OWNED_TIER: ${{ inputs.owned_tier }}
          JEV_KEY: ${{ secrets.EXAMPLE_JEV_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.EXAMPLE_CLAUDE_OAUTH_TOKEN }}
          YOUR_TICKETING_CREDENTIAL_ENV_VAR: ${{ secrets.EXAMPLE_TICKETING_CREDENTIAL }}
        run: |
          "$MARGOT_ROOT/node_modules/.bin/margot-review" \
            "$MARGOT_ROOT/request.json" "$MARGOT_ROOT/config.json" "$MARGOT_ROOT/result.json"
          published=$(jq -r 'if .result.publication == null then "" else "true" end' \
            "$MARGOT_ROOT/result.json")
          echo "published=$published" >> "$GITHUB_OUTPUT"
      # Each reviewer's output, verbatim, in this run's summary: a mechanical echo of
      # diagnostics.json, each block in a tilde fence so its own content renders literally.
      - name: Reviewer output (verbatim) to the run summary
        if: always()
        # Display only: it never changes the job's result.
        continue-on-error: true
        run: |
          set -uo pipefail
          diagnostics="$MARGOT_ROOT/diagnostics.json"
          [ -s "$diagnostics" ] || exit 0
          n="$(jq -r '(.cards // []) | length' "$diagnostics" 2>/dev/null || echo 0)"
          [ "$n" -gt 0 ] 2>/dev/null || exit 0
          {
            echo "## Margot — reviewer output (verbatim)"
            echo
            jq -r '.cards[] | "### " + .card + "\n\n~~~\n" + ((.raw // "") as $r | if $r == "" then "(no output — reviewer did not complete)" elif ($r | length) > 20000 then ($r[0:20000] + "\n… (truncated — full output in the diagnostics artifact)") else $r end) + "\n~~~\n"' "$diagnostics"
          } >> "$GITHUB_STEP_SUMMARY"
      # The only durable copy of each reviewer's raw output and the voice's prose once the
      # run ends, kept 90 days.
      - name: Upload the review's diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: margot-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/margot/diagnostics.json
            ${{ runner.temp }}/margot/result.json
          retention-days: 90
          if-no-files-found: warn

  close-stranded-check:
    needs: [route, review]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Bootstrap the exact release bytes
        env:
          MARGOT_ROOT: ${{ runner.temp }}/margot
          DEPLOYMENT_JSON: ${{ vars.YOUR_MARGOT_DEPLOYMENT_JSON }}
          CONFIG_JSON: ${{ vars.YOUR_MARGOT_CONFIG_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$MARGOT_ROOT" "$RUNNER_TEMP/trusted"
          printf '%s' "$DEPLOYMENT_JSON" > "$RUNNER_TEMP/trusted/deployment.json"
          printf '%s' "$CONFIG_JSON" > "$RUNNER_TEMP/trusted/config.json"
          package=$(jq -r .packageReference <<< "$DEPLOYMENT_JSON")
          sha256=$(jq -r .packageSha256 <<< "$DEPLOYMENT_JSON")
          archive="$MARGOT_ROOT/margot-pr-reviewer.tgz"
          curl --fail --location --silent --show-error "$package" --output "$archive"
          echo "$sha256  $archive" | sha256sum --check
          npm install --prefix "$MARGOT_ROOT" --ignore-scripts --save-exact "$archive"
          echo "MARGOT_ROOT=$MARGOT_ROOT" >> "$GITHUB_ENV"
      - name: Name the target repository
        id: target
        env:
          TARGET_REPO: ${{ inputs.repo }}
        run: |
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET_REPO#*/}" >> "$GITHUB_OUTPUT"
      - name: Mint the check-write token (target repository)
        id: closer
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YOUR_MARGOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.EXAMPLE_MARGOT_APP_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: |
            ${{ steps.target.outputs.name }}
          permission-checks: write
          permission-pull-requests: read
          permission-contents: read
      - name: Close a review check left in progress
        env:
          GH_TOKEN: ${{ steps.closer.outputs.token }}
          TARGET_REPO: ${{ inputs.repo }}
          PR_NUMBER: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.sha }}
          # Placeholder: your App's numeric App ID, the same number as publisher.appId.
          MARGOT_APP_ID: "123456"
          RUNS_URL_PREFIX: ${{ github.server_url }}/${{ github.repository }}/actions/runs/
          RUN_ID: ${{ github.run_id }}
          ROUTE_RESULT: ${{ needs.route.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
          PUBLISHED: ${{ needs.review.outputs.published }}
          STOP_REASON: ${{ needs.review.outputs.stop_reason }}
          LIVE_SHA: ${{ needs.review.outputs.live_sha }}
        run: |
          "$MARGOT_ROOT/node_modules/.bin/margot-instance" close-stranded-check \
            --repository "$TARGET_REPO" --pr "$PR_NUMBER" --head "$HEAD_SHA" \
            --app-id "$MARGOT_APP_ID" --check-name "review / margot" \
            --own-runs "$RUNS_URL_PREFIX" --own-run-id "$RUN_ID" \
            --route-result "$ROUTE_RESULT" --review-result "$REVIEW_RESULT" \
            --published "$PUBLISHED" --stop-reason "$STOP_REASON" --live-sha "$LIVE_SHA"
