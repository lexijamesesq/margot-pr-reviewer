# Node 22+, gh, the pinned Claude CLI and publish-skills must be provisioned
# on this isolated self-hosted runner. Config and request are trusted inputs.
name: Margot shadow
on: workflow_dispatch
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  shadow:
    runs-on: [self-hosted, YOUR_REVIEW_RUNNER]
    steps:
      - name: Install the exact package release
        run: npm install --prefix "$RUNNER_TEMP/YOUR_REVIEW_INSTALL" --ignore-scripts --save-exact margot-pr-reviewer@0.4.0
      - name: Review the requested head
        env:
          GH_TOKEN: ${{ github.token }}
          JEV_KEY: ${{ secrets.EXAMPLE_JEV_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.EXAMPLE_CLAUDE_OAUTH_TOKEN }}
        run: |
          "$RUNNER_TEMP/YOUR_REVIEW_INSTALL/node_modules/.bin/margot-review" \
            /path/to/your/request.json /path/to/your/config.json /path/to/your/result.json
