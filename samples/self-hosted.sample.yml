# Store these trusted files outside the pull-request checkout. Provision the pinned
# Claude CLI, ticketing server, and publish-skills at the configured runtime paths.
name: Margot shadow
on: workflow_dispatch
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  shadow:
    runs-on: [self-hosted, YOUR_REVIEW_RUNNER]
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Bootstrap the exact release bytes
        env:
          ENGINE_ROOT: ${{ runner.temp }}/margot
          DEPLOYMENT: /trusted/margot/deployment.json
        run: |
          set -euo pipefail
          mkdir -p "$ENGINE_ROOT"
          package=$(jq -r .packageReference "$DEPLOYMENT")
          sha256=$(jq -r .packageSha256 "$DEPLOYMENT")
          archive="$ENGINE_ROOT/margot-pr-reviewer.tgz"
          curl --fail --location --silent --show-error "$package" --output "$archive"
          echo "$sha256  $archive" | sha256sum --check
          npm install --prefix "$ENGINE_ROOT" --ignore-scripts --save-exact "$archive"
          echo "ENGINE_ROOT=$ENGINE_ROOT" >> "$GITHUB_ENV"
      - name: Validate the deployment and enrolled target
        id: route
        env:
          TARGET_REPO: YOUR_ORG/YOUR_REPOSITORY
        run: |
          "$ENGINE_ROOT/node_modules/.bin/margot-instance" validate-deployment \
            --deployment /trusted/margot/deployment.json \
            --release-repository YOUR_ORG/margot-pr-reviewer \
            --repository "$TARGET_REPO" \
            --enrolled-repositories '["YOUR_ORG/YOUR_REPOSITORY"]' \
            --authority-repositories '[]'
      - name: Bind trusted configuration to the requested PR
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: YOUR_ORG/YOUR_REPOSITORY
          PR_NUMBER: "1"
          HEAD_SHA: "0000000000000000000000000000000000000000"
        run: |
          "$ENGINE_ROOT/node_modules/.bin/margot-instance" bind-request \
            --repository "$TARGET_REPO" --pr "$PR_NUMBER" --head "$HEAD_SHA" \
            --phase review --authority "${{ steps.route.outputs.authority }}" \
            --engine-root "$ENGINE_ROOT" --config /trusted/margot/config.json \
            --required-checks '["YOUR_REQUIRED_CHECK"]' \
            --protected-paths '["YOUR_AUTHORITY_PATH/**"]' \
            --allowed-skipped-checks '[]'
      - name: Review the bound request
        env:
          GH_TOKEN: ${{ github.token }}
          JEV_KEY: ${{ secrets.EXAMPLE_JEV_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.EXAMPLE_CLAUDE_OAUTH_TOKEN }}
          YOUR_TICKETING_CREDENTIAL_ENV_VAR: ${{ secrets.EXAMPLE_TICKETING_CREDENTIAL }}
        run: |
          "$ENGINE_ROOT/node_modules/.bin/margot-review" \
            "$ENGINE_ROOT/request.json" "$ENGINE_ROOT/config.json" "$ENGINE_ROOT/result.json"
