name: CI
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: retained-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: ci / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: ci / package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Packed outside the checkout: `attw --pack .` packs and removes a tarball
      # of the same name in the working directory.
      - id: pack
        run: echo "tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")" >> "$GITHUB_OUTPUT"
      - run: npx --yes publint@0.3.25 "$RUNNER_TEMP/${{ steps.pack.outputs.tarball }}"
      # The package is ESM-only by design: ignore the two rules that flag a
      # CommonJS or node10 consumer, the only resolutions it does not support.
      - run: npx --yes @arethetypeswrong/cli@0.18.5 --pack . --ignore-rules no-resolution cjs-resolves-to-esm
      - run: node scripts/package-smoke.mjs "$RUNNER_TEMP/${{ steps.pack.outputs.tarball }}"
