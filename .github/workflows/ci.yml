name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A PR's runs group on its ref (refs/pull/<N>/merge), so a new push cancels the
# superseded run. A push to the default branch groups on its own sha and is
# never cancelled: GitHub keeps only one pending run per group, so a shared
# group would silently drop a pending push run -- and with it any job a repo
# adds that must run on every merge, such as a release job.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  floor:
    # The required check is `ci / checks`: this job's name, then the called
    # job's (estate-ci.yml's check_name). Convention `<lane> / <what it checks>`.
    name: ci
    # Ceiling only: the reusable's own job declares the narrow scopes it
    # actually needs (contents/pull-requests/checks: read, for Jev's triage
    # answer on the head's check-runs) and a called workflow can never exceed
    # what its caller grants. No write scope, no secret: this is the lane a
    # PR controls.
    permissions: read-all
    uses: lexijamesesq/dotty/.github/workflows/estate-ci.yml@v1

  test:
    name: ci / test
    needs: [floor]
    if: ${{ (github.event_name == 'pull_request') && needs.floor.outputs.mechanical != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: ci / package
    needs: [floor]
    if: ${{ (github.event_name == 'pull_request') && needs.floor.outputs.mechanical != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Packed outside the checkout: `attw --pack .` packs and removes a tarball
      # of the same name in the working directory.
      - id: pack
        run: echo "tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")" >> "$GITHUB_OUTPUT"
      - run: npx --yes publint@0.3.25 "$RUNNER_TEMP/${{ steps.pack.outputs.tarball }}"
      # The package is ESM-only by design: ignore the two rules that flag a
      # CommonJS or node10 consumer, the only resolutions it does not support.
      - run: npx --yes @arethetypeswrong/cli@0.18.5 --pack . --ignore-rules no-resolution cjs-resolves-to-esm
      - run: node scripts/package-smoke.mjs "$RUNNER_TEMP/${{ steps.pack.outputs.tarball }}"
