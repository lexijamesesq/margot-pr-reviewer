name: CI
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

# The reusable uses one PR concurrency group and cancels superseded runs.
jobs:
  checks:
    name: CI
    uses: lexijamesesq/dotty/.github/workflows/estate-pr-ci.yml@v1
    secrets:
      OPERATOR_RULES: ${{ secrets.OPERATOR_RULES }}
      MARGOT_APP_KEY: ${{ secrets.MARGOT_APP_KEY }}
      MARGOT_JEV_KEY: ${{ secrets.MARGOT_JEV_KEY }}
      MARGOT_ANTHROPIC_TOKEN: ${{ secrets.MARGOT_ANTHROPIC_TOKEN }}

  package:
    name: ci / package validation
    needs: checks
    if: needs.checks.outputs.classification != 'mechanical' && needs.checks.outputs.classification != 'documentation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: reviewer-package-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Require the classified PR head
        env:
          CLASSIFICATION: ${{ needs.checks.outputs.classification }}
          HEAD_SHA: ${{ needs.checks.outputs.head_sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { CLASSIFICATION, HEAD_SHA, EVENT_HEAD, ACTIONS_CACHE_MODE } = process.env;
            if (CLASSIFICATION !== 'functional' || HEAD_SHA !== EVENT_HEAD ||
                !/^[0-9a-f]{40}$/.test(HEAD_SHA ?? '') ||
                !['read', 'none'].includes(ACTIONS_CACHE_MODE)) {
              core.setFailed('Expected a functional PR, matching authenticated head, and read-only or disabled cache access.');
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checks.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - id: pack
        run: echo "tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")" >> "$GITHUB_OUTPUT"
      - run: npx --yes publint@0.3.25 "$RUNNER_TEMP/$TARBALL"
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
      # The package is ESM-only; CommonJS and node10 resolution are unsupported.
      - run: npx --yes @arethetypeswrong/cli@0.18.5 "$RUNNER_TEMP/$TARBALL" --ignore-rules no-resolution cjs-resolves-to-esm
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
      - run: node scripts/package-smoke.mjs "$RUNNER_TEMP/$TARBALL"
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
