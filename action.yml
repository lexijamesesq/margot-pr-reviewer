name: Margot shadow review
description: Run the installed Margot package with live reads and recorded publication
inputs:
  request:
    description: Absolute path to the SHA-bound request JSON
    required: true
  config:
    description: Absolute path to trusted instance configuration
    required: true
  output:
    description: Absolute path for the local result and raw response JSON
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MARGOT_REQUEST_FILE: ${{ inputs.request }}
        MARGOT_CONFIG_FILE: ${{ inputs.config }}
        MARGOT_OUTPUT_FILE: ${{ inputs.output }}
      run: margot-review "$MARGOT_REQUEST_FILE" "$MARGOT_CONFIG_FILE" "$MARGOT_OUTPUT_FILE"
